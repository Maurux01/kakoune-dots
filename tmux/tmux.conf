# tmux.conf — tmux integrado con Kakoune (fullstack)
# Destino Arch/Debian: ~/.config/tmux/tmux.conf  (fallback: ~/.tmux.conf)
# Instalador.sh lo copia y reemplaza (con backup .bak).
#
# Diseño:
#  - prefix C-Space (no choca con kak), escape-time 0 (clave para modal)
#  - truecolor + focus-events (kak-lsp, autoreload, highlight)
#  - C-h/j/k/l sin prefix para moverse entre paneles (igual que en kak 04-tmux.kak)
#  - vi-mode en copy, clipboard vía wl-copy/xclip/tmux buffer
#  - popups: <prefix>g lazygit, <prefix>f sessionizer, <prefix>t htop

# ── base ─────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,kitty:RGB,wezterm:RGB"
set -g focus-events on
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "tmux: #S / #W"
set -g status-interval 5

# prefix C-Space (mantiene C-b libre, no choca con kak que usa <space>)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# recargar config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux recargado"

# ── splits intuitivos (heredan cwd) ──────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── navegación kak-style C-h/j/k/l SIN prefix ────────────────────────────────
# ¡Mismo mapeo que en kakoune 04-tmux.kak (: tmux-navigate)!
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
# redimensionar con Alt-h/j/k/l
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5
# moverse entre ventanas con S-Left/Right o C-p/C-n
bind -n S-Left previous-window
bind -n S-Right next-window

# ── copy-mode vi + clipboard ─────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh -c 'if [ -n \"$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null; then wl-copy -n; elif [ -n \"$DISPLAY\" ] && command -v xclip >/dev/null; then xclip -selection clipboard; else tmux load-buffer -; fi'"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "sh -c 'if [ -n \"$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null; then wl-copy -n; elif [ -n \"$DISPLAY\" ] && command -v xclip >/dev/null; then xclip -selection clipboard; else tmux load-buffer -; fi'"
bind p paste-buffer

# ── popups fullstack (tmux >= 3.2) ───────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit 2>/dev/null || git status; echo; echo '[enter para cerrar]'; read"
bind f display-popup -E -w 80% -h 60% "tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "htop 2>/dev/null || top"
bind e display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "kak-lsp --version 2>/dev/null; echo; kak -version 2>/dev/null || kakoune -version"

# ── abrir kak rápido ─────────────────────────────────────────────────────────
bind k new-window -c "#{pane_current_path}" "kak"
bind K split-window -h -c "#{pane_current_path}" "kak"

# ── estética minimal (no pelea con colorscheme kak) ──────────────────────────
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e] "
set -g status-right "#[fg=#6c7086]#H | %Y-%m-%d %H:%M "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
setw -g window-status-format "#[fg=#cdd6f4] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g popup-border-style "fg=#89b4fa"
